[package]
name = "lppo-x2d"
version = "1.0.0"
edition = "2021"
description = "2D graphics framework for LPPO using raylib."
repository = "https://github.com/AlexMatzen01/LPPX"

[lib]
name = "lppo_x2d"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
raylib = "5.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
